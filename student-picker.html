<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Student Picker | TeacherHelpPlus</title>

  <link rel="stylesheet" href="style.css">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
</head>

<body>

  <!-- Navigation -->
  <nav class="navbar">
    <div class="logo">
      🎓 Teacher<span>HelpPlus</span>
    </div>

    <a href="index.html" class="back-btn">
      ← Back Home
    </a>
  </nav>


  <!-- Student Picker -->
  <section class="picker-page">

    <div class="picker-container">

      <div class="badge">
        🎲 Random Student Picker
      </div>

      <h1>Pick a Student <span>Randomly!</span></h1>

      <p class="picker-description">
        Add your students and let TeacherHelpPlus choose one randomly.
      </p>


      <!-- Add Student -->
      <div class="add-student">

        <input
          type="text"
          id="studentName"
          placeholder="Enter student name..."
        >

        <button onclick="addStudent()">
          Add Student +
        </button>

      </div>


      <!-- Student List -->
      <div class="student-list-section">

        <h3>
          Students (<span id="studentCount">0</span>)
        </h3>

        <div id="studentList" class="student-list">
          <p class="empty-message">
            No students added yet.
          </p>
        </div>

      </div>


      <!-- Pick Student -->
      <button class="pick-btn" onclick="pickStudent()">
        🎲 Pick Random Student
      </button>


      <!-- Result -->
      <div id="result" class="result-box">
        <p>Your selected student will appear here!</p>
      </div>

    </div>

  </section>


  <script src="student-picker.js"></script>

</body>
</html>
